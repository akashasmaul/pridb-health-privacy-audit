name: Bug report
description: Report a reproducible implementation defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Explain the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python, PostgreSQL"
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I confirm this report contains no real patient data or secrets.
          required: true

